[manager]
keymap = [
  { on = "<Esc>", run = "escape",             desc = "Exit visual mode / clear filter" },
  { on = "q",     run = "quit",               desc = "Quit" },
  { on = "Q",     run = "quit --no-cwd-file", desc = "Quit without cwd" },
  { on = "<C-q>", run = "close",              desc = "Close tab" },

  # Navigation
  { on = "h", run = "leave",   desc = "Go to parent dir" },
  { on = "j", run = "arrow 1", desc = "Move down" },
  { on = "k", run = "arrow -1",desc = "Move up" },
  { on = "l", run = "enter",   desc = "Enter dir / open file" },

  { on = "H", run = "back",    desc = "History back" },
  { on = "L", run = "forward", desc = "History forward" },

  { on = "g", run = "cd ~",    desc = "Go home" },
  { on = ".", run = "hidden",  desc = "Toggle hidden files" },

  # Selection
  { on = "<Space>", run = "select --state=none", desc = "Toggle selection" },
  { on = "v",       run = "visual_mode",          desc = "Enter visual mode" },
  { on = "V",       run = "select_all",            desc = "Select all" },

  # Operations
  { on = "y", run = "yank",     desc = "Yank (copy)" },
  { on = "x", run = "yank --cut", desc = "Yank (cut)" },
  { on = "p", run = "paste",    desc = "Paste" },
  { on = "P", run = "paste --force", desc = "Paste (overwrite)" },
  { on = "d", run = "remove",   desc = "Move to trash" },
  { on = "D", run = "remove --permanently", desc = "Delete permanently" },
  { on = "r", run = "rename",   desc = "Rename" },
  { on = "a", run = "create",   desc = "Create file/dir" },

  # Preview / open
  { on = "<Enter>", run = "open",             desc = "Open selected" },
  { on = "o",       run = "open --interactive", desc = "Open interactively" },
  { on = "i",       run = "peek 1",           desc = "Peek next" },
  { on = "I",       run = "peek -1",          desc = "Peek prev" },

  # Search
  { on = "/", run = "find",         desc = "Find in directory" },
  { on = "n", run = "find_arrow 1", desc = "Next match" },
  { on = "N", run = "find_arrow -1",desc = "Prev match" },
  { on = "s", run = "search fd",    desc = "Search (fd)" },
  { on = "S", run = "search rg",    desc = "Search contents (rg)" },

  # Tabs
  { on = "t",   run = "tab_create --current", desc = "New tab" },
  { on = "<Tab>",   run = "tab_switch 1 --relative", desc = "Next tab" },
  { on = "<S-Tab>", run = "tab_switch -1 --relative", desc = "Prev tab" },

  # Sort
  { on = [ ",", "n" ], run = "sort natural  --dir-first", desc = "Sort: natural" },
  { on = [ ",", "m" ], run = "sort modified --dir-first --reverse", desc = "Sort: modified" },
  { on = [ ",", "s" ], run = "sort size     --dir-first --reverse", desc = "Sort: size" },

  # Help
  { on = "?", run = "help", desc = "Open keybind help" },
]
