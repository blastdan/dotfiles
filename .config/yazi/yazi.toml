[manager]
ratio          = [1, 2, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true

[preview]
tab_size       = 2
max_width      = 600
max_height     = 900
cache_dir      = ""
image_filter   = "triangle"
image_quality  = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = 'nvim "$@"', desc = "nvim", block = true },
]
open = [
  { run = 'wslview "$@"', desc = "Open with Windows", orphan = true },
]
reveal = [
  { run = 'wslview "$(wslpath -w "$(dirname "$0")")"', desc = "Reveal in Explorer", orphan = true },
]

[open]
rules = [
  { mime = "text/*",        use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "*/javascript",  use = "edit" },
  { mime = "*/typescript",  use = "edit" },
  { mime = "image/*",       use = "open" },
  { mime = "video/*",       use = "open" },
  { mime = "audio/*",       use = "open" },
  { mime = "inode/x-empty", use = "edit" },
]
