# ============================================================
# TMUX CONFIG — Agent-First Workflow
# Catppuccin Macchiato | i3-style keybinds | Beginner hints
# ============================================================

# ============================================================
# CORE SETTINGS
# ============================================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Prefix: Ctrl-a (like screen, easier than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g escape-time 10          # faster escape in neovim
set -g focus-events on         # tell neovim when window is focused
set -g history-limit 50000
set -g mouse on                # click to select panes/windows
set -g base-index 1            # windows start at 1 (keyboard-friendly)
set -g pane-base-index 1
set -g renumber-windows on     # re-number when windows are closed
set -g set-clipboard on        # OSC 52 clipboard (works in Windows Terminal + WezTerm)
set -g mode-keys vi            # vi keys in copy mode

# Window naming — show the running command (e.g. nvim, python, git)
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_command}'
set -g allow-rename off        # don't let programs override the name via escape codes

# ============================================================
# KEYBINDS — i3-style
# ============================================================

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes (intuitive symbols)
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# Navigate panes WITHOUT prefix (seamless with neovim via vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Resize panes with prefix + Shift-hjkl
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Fullscreen toggle
bind f resize-pane -Z

# Close pane/window
bind x kill-pane
bind X kill-window

# Switch windows by number (like i3 workspaces)
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Session picker
bind s choose-tree -Zs

# Sessionizer (fzf project picker)
bind T display-popup -E "tmux-sessionizer"

# Cheatsheet popup
bind ? display-popup -E -w 64 -h 24 "cat <<'EOF'
╔══════════════════════════════════════════════════════════╗
║              TMUX KEYBINDS  (prefix = Ctrl-a)            ║
╠══════════════════════════════════════════════════════════╣
║  PANES                                                   ║
║  Ctrl-a -      Split horizontal                          ║
║  Ctrl-a \\     Split vertical                            ║
║  Ctrl-h/j/k/l  Navigate panes (no prefix!)               ║
║  Ctrl-a H/J/K/L  Resize pane                             ║
║  Ctrl-a f      Fullscreen toggle                         ║
║  Ctrl-a x      Close pane                                ║
╠══════════════════════════════════════════════════════════╣
║  WINDOWS                                                 ║
║  Ctrl-a c      New window                                ║
║  Ctrl-a 1-9    Switch window                             ║
║  Ctrl-a X      Close window                              ║
╠══════════════════════════════════════════════════════════╣
║  SESSIONS                                                ║
║  Ctrl-a s      Session picker                            ║
║  Ctrl-a T      Project sessionizer (fzf)                 ║
╠══════════════════════════════════════════════════════════╣
║  AGENT LAYOUTS                                           ║
║  Ctrl-a A      Agent workspace (nvim + opencode + shell) ║
║  Ctrl-a G      Review workspace (lazygit + opencode)     ║
║  Ctrl-a M      Multi-agent (4-pane grid)                 ║
╠══════════════════════════════════════════════════════════╣
║  OTHER                                                   ║
║  Ctrl-a r      Reload config                             ║
║  Ctrl-a ?      This cheatsheet                           ║
╚══════════════════════════════════════════════════════════╝
EOF
read -r"

# Agent workspace layouts
bind A display-popup -E "agent-workspace"
bind G display-popup -E "review-workspace"
bind M display-popup -E "multi-agent"

# ============================================================
# COPY MODE (vi-style)
# ============================================================
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "cat | xclip -sel clip 2>/dev/null || true"
bind -T copy-mode-vi Y   send -X copy-line
bind -T copy-mode-vi Escape send -X cancel

# Paste from tmux buffer
bind p paste-buffer
bind P choose-buffer  # pick from buffer history

# ============================================================
# CATPPUCCIN MACCHIATO THEME
# ============================================================

# Palette
base="#24273a"
mantle="#1e2030"
surface0="#363a4f"
surface1="#494d64"
overlay0="#6e738d"
overlay2="#939ab7"
text="#cad3f5"
lavender="#b7bdf8"
blue="#8aadf4"
teal="#8bd5ca"
green="#a6da95"
yellow="#eed49f"
peach="#f5a97f"
red="#ed8796"
mauve="#c6a0f6"

# Pane borders
set -g pane-border-style "fg=${surface1}"
set -g pane-active-border-style "fg=${mauve}"

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=${mantle},fg=${text}"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=${mauve},fg=${base},bold] #S #[bg=${mantle},fg=${mauve}]\ue0b0 "

# Right: hints + time
set -g status-right-length 120
set -g status-right "#[fg=${overlay0}] ^a-  split  hjkl  nav  ^af  zoom  ^a?  help #[fg=${surface1}]│#[fg=${blue}] %H:%M #[fg=${surface1}]│#[bg=${blue},fg=${base}] %d %b "

# Window tabs
set -g window-status-format "#[fg=${overlay0}] #I #W "
set -g window-status-current-format "#[bg=${surface0},fg=${mauve},bold] #I #[fg=${text}]#W #[bg=${mantle},fg=${surface0}]\ue0b0"
set -g window-status-separator ""

# Message / command bar
set -g message-style "bg=${surface0},fg=${yellow}"
set -g message-command-style "bg=${surface0},fg=${blue}"

# ============================================================
# PLUGINS (tpm)
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # persist sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save sessions

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# Initialize tpm (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
